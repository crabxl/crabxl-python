name: Python compatibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install 'ruff>=0.16.10,<0.17'
      - run: ruff format --check .
      - run: ruff check .
  adapter:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: ${{ matrix.python == '3.15' }}
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: python -m pip install maturin "pytest>=9.1.1,<10" "openpyxl==3.1.5" "Pillow>=12.3" "lxml>=6.1.3"
      - run: maturin build --release --locked --out dist
      - run: python -m pip install dist/*.whl
      - run: python -m pytest tests -q
      - run: maturin sdist --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
