name: Python compatibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - run: uvx 'ruff>=0.16.10,<0.17' format --check .
      - run: uvx 'ruff>=0.16.10,<0.17' check .
      # crabxl is checked by three type checkers in strict mode, against the
      # stub of the native module; nothing is built.
      - run: uvx pyright@1.1.408
      - run: uvx mypy@1.19.1
      - run: uvx pyrefly@1.5.0 check
      - name: ty (advisory while it is in beta)
        continue-on-error: true
        run: uvx ty@0.0.111 check

  linux:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - run: uv python install 3.9 3.10 3.11 3.12 3.13 3.14 3.15
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build the bindings for every CPython version with shared Rust dependencies
        run: uv run --no-project --with 'maturin>=1.15,<2' tools/packages.py build
      - name: Test each version in a clean environment
        run: uv run --no-project tools/packages.py test

  native-platforms:
    needs: quality
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - run: uv python install 3.9 3.15
      - run: uv run --no-project --with 'maturin>=1.15,<2' tools/packages.py build --python 3.9 3.15
      - run: uv run --no-project tools/packages.py test --python 3.9 3.15
