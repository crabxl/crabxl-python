name: Python compatibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install 'ruff>=0.16.10,<0.17'
      - run: ruff format --check .
      - run: ruff check .
  adapter:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/setup-supported-python
        id: pythons
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: python -m pip install 'maturin>=1.15,<2'
      - name: Build all five wheels with shared Rust dependencies
        env:
          PYTHON_PATHS: ${{ toJSON(steps.pythons.outputs) }}
        run: python tools/platform_wheels.py build
      - name: Test each wheel in its matching clean Python environment
        env:
          PYTHON_PATHS: ${{ toJSON(steps.pythons.outputs) }}
        run: python tools/platform_wheels.py test
      - run: maturin sdist --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: python-packages-linux-x86_64
          path: dist/*
          if-no-files-found: error

  native-platforms:
    needs: quality
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install maturin "pytest>=9.1.1,<10" "openpyxl==3.1.5" "Pillow>=12.3" "lxml>=6.1.3"
      - run: maturin build --release --locked --out dist
      - shell: bash
        run: python -m pip install dist/*.whl
      - run: python -m pytest tests -q
