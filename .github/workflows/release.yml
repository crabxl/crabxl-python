name: Release Python

# A push to main whose version has no tag yet releases that commit. The tag
# and the GitHub release are created after publishing. Run the workflow
# manually to resume an interrupted release. When nothing since the previous
# release changes the native build, the release reuses its compiled modules.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild:
        description: Compile every wheel even when the previous ones fit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: python-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.request.outputs.release }}
      version: ${{ steps.request.outputs.version }}
      notes: ${{ steps.request.outputs.notes }}
      reuse: ${{ steps.request.outputs.reuse }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install 'ruff>=0.16.10,<0.17'
      - run: ruff format --check .
      - run: ruff check .
      - name: Check the committed version and its changelog section
        id: request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REBUILD: ${{ inputs.rebuild }}
        run: python tools/release_tag.py

  package:
    needs: validate
    if: needs.validate.outputs.release == 'true' && needs.validate.outputs.reuse == ''
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-supported-python
        id: pythons
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build portable Linux wheels
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: 'v1.15.0'
          rust-toolchain: 'stable'
          target: ${{ matrix.platform.target }}
          manylinux: '2_28'
          args: >-
            --release --locked --out dist --interpreter
            /opt/python/cp311-cp311/bin/python
            /opt/python/cp312-cp312/bin/python
            /opt/python/cp313-cp313/bin/python
            /opt/python/cp314-cp314/bin/python
            /opt/python/cp315-cp315/bin/python
      - name: Install the native package builder
        if: runner.os != 'Linux'
        run: pip install 'maturin>=1.15,<2'
      - name: Build Windows and macOS wheels
        if: runner.os != 'Linux'
        env:
          PYTHON_PATHS: ${{ toJSON(steps.pythons.outputs) }}
        run: python tools/platform_wheels.py build --target ${{ matrix.platform.target }}
      - name: Test all five installed CPython wheels
        env:
          PYTHON_PATHS: ${{ toJSON(steps.pythons.outputs) }}
        run: python tools/platform_wheels.py test
      - uses: actions/upload-artifact@v7
        with:
          name: release-wheel-${{ matrix.platform.name }}
          path: dist/*.whl
          if-no-files-found: error

  repack:
    needs: validate
    if: needs.validate.outputs.release == 'true' && needs.validate.outputs.reuse != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install 'maturin>=1.15,<2'
      - run: maturin sdist --out new
      - name: Download the wheels of the previous release
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE: ${{ needs.validate.outputs.reuse }}
        run: gh release download "$REUSE" --pattern '*.whl' --dir old
      - run: python tools/repack_wheels.py repack old new
      - uses: actions/upload-artifact@v7
        with:
          name: repacked-wheels
          path: new/*.whl
          if-no-files-found: error

  test-repacked:
    needs: repack
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-24.04, wheels: '*manylinux*_x86_64.whl' }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, wheels: '*manylinux*_aarch64.whl' }
          - { name: windows-x86_64, runner: windows-latest, wheels: '*win_amd64.whl' }
          - { name: macos-x86_64, runner: macos-15-intel, wheels: '*macosx*_x86_64.whl' }
          - { name: macos-arm64, runner: macos-15, wheels: '*macosx*_arm64.whl' }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-supported-python
        id: pythons
      - uses: actions/download-artifact@v8
        with:
          name: repacked-wheels
          path: all
      - name: Keep this platform's wheels
        shell: bash
        run: mkdir dist && cp all/${{ matrix.platform.wheels }} dist/
      - name: Test all five installed CPython wheels
        env:
          PYTHON_PATHS: ${{ toJSON(steps.pythons.outputs) }}
        run: python tools/platform_wheels.py test
      - uses: actions/upload-artifact@v7
        with:
          name: release-wheel-${{ matrix.platform.name }}
          path: dist/*.whl
          if-no-files-found: error

  source:
    needs: validate
    if: needs.validate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install 'maturin>=1.15,<2'
      - run: maturin sdist --out dist
      - name: Build and test from the source distribution
        run: python tools/test_distribution.py '*.tar.gz'
      - uses: actions/upload-artifact@v7
        with:
          name: release-source
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [validate, package, test-repacked, source]
    # One of package and test-repacked runs; the other is skipped.
    if: >-
      always() && needs.validate.outputs.release == 'true'
      && needs.source.result == 'success'
      && (needs.package.result == 'success' || needs.test-repacked.result == 'success')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify artifact identities and safe retries
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: python tools/check_release_files.py "$RELEASE_VERSION"
      - name: Publish to PyPI using OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  release:
    needs: [validate, publish]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Recheck the version and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_NOTES: ${{ needs.validate.outputs.notes }}
        run: |
          python tools/release.py check "$RELEASE_VERSION"
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$RELEASE_VERSION" > /dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION" dist/* --clobber
          else
            gh release create "$RELEASE_VERSION" dist/* --target "$GITHUB_SHA" \
              --title "$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
