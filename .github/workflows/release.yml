name: Release Python

# A push to main releases each package whose committed version has no tag yet:
# crabxl-bindings (the native wheels), crabxl and crabxl-openpyxl. The tags and
# GitHub releases are created after publishing. Run the workflow manually to
# resume an interrupted release. Each package publishes from its own
# environment, pypi-<package>, which its PyPI trusted publisher names.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.request.outputs.releases }}
      bindings: ${{ steps.request.outputs.bindings }}
      pure: ${{ steps.request.outputs.pure }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - run: uvx 'ruff>=0.16.10,<0.17' format --check .
      - run: uvx 'ruff>=0.16.10,<0.17' check .
      - name: Find the package versions to release
        id: request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: uv run --no-project tools/release_tag.py

  bindings:
    needs: validate
    if: needs.validate.outputs.bindings == 'true'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - run: uv python install 3.9 3.10 3.11 3.12 3.13 3.14 3.15
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build portable Linux wheels
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: 'v1.15.0'
          rust-toolchain: 'stable'
          target: ${{ matrix.platform.target }}
          manylinux: '2_28'
          working-directory: packages/crabxl-bindings
          args: >-
            --release --locked --out ../../dist --interpreter
            /opt/python/cp39-cp39/bin/python
            /opt/python/cp310-cp310/bin/python
            /opt/python/cp311-cp311/bin/python
            /opt/python/cp312-cp312/bin/python
            /opt/python/cp313-cp313/bin/python
            /opt/python/cp314-cp314/bin/python
            /opt/python/cp315-cp315/bin/python
      - name: Build Windows and macOS wheels
        if: runner.os != 'Linux'
        run: uv run --no-project --with 'maturin>=1.15,<2' tools/packages.py build --target ${{ matrix.platform.target }}
      - name: Test every CPython wheel with this commit's packages
        run: uv run --no-project tools/packages.py test
      - uses: actions/upload-artifact@v7
        with:
          name: release-bindings-${{ matrix.platform.name }}
          path: dist/*.whl
          if-no-files-found: error

  bindings-source:
    needs: validate
    if: needs.validate.outputs.bindings == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - run: uv python install 3.15
      - uses: dtolnay/rust-toolchain@stable
      - run: uvx --from 'maturin>=1.15,<2' maturin sdist --manifest-path packages/crabxl-bindings/Cargo.toml --out dist
      - name: Build and test from the source distribution
        run: uv run --no-project tools/packages.py test --python 3.15
      - uses: actions/upload-artifact@v7
        with:
          name: release-bindings-source
          path: dist/*.tar.gz
          if-no-files-found: error

  pure:
    needs: [validate, bindings]
    # Runs after the bindings wheels when they are released too.
    if: >-
      always() && needs.validate.outputs.pure != '[]'
      && needs.bindings.result != 'failure' && needs.bindings.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - run: uv python install 3.9 3.13 3.15
      - name: Build the pure-Python packages
        env:
          PACKAGES: ${{ needs.validate.outputs.pure }}
        run: for package in $(jq -r '.[]' <<< "$PACKAGES"); do uv build --package "$package" --out-dir dist; done
      - uses: actions/upload-artifact@v7
        with:
          name: release-pure
          path: dist/*
          if-no-files-found: error
      - name: Use the bindings wheels of this release
        if: needs.bindings.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: release-bindings-linux-x86_64
          path: dist
      - name: Test the packages with their bindings
        run: uv run --no-project tools/packages.py test --python 3.9 3.13 3.15

  publish-bindings:
    needs: [validate, bindings, bindings-source, pure]
    if: >-
      always() && needs.validate.outputs.bindings == 'true'
      && needs.bindings.result == 'success' && needs.bindings-source.result == 'success'
      && needs.pure.result != 'failure' && needs.pure.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: pypi-crabxl-bindings
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-bindings-*
          path: dist
          merge-multiple: true
      - run: python tools/check_release_files.py dist crabxl-bindings
      - name: Publish to PyPI using OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  publish:
    needs: [validate, pure, publish-bindings]
    if: >-
      always() && needs.validate.outputs.pure != '[]' && needs.pure.result == 'success'
      && needs.publish-bindings.result != 'failure' && needs.publish-bindings.result != 'cancelled'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJSON(needs.validate.outputs.pure) }}
    environment: pypi-${{ matrix.package }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          name: release-pure
          path: all
      - name: Keep this package's files
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          stem="${PACKAGE//-/_}"
          mkdir dist && cp all/"$stem"-[0-9]* dist/
          python tools/check_release_files.py dist "$PACKAGE"
      - name: Publish to PyPI using OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  release:
    needs: [validate, publish-bindings, publish]
    if: >-
      always() && needs.validate.outputs.releases != '[]'
      && needs.publish-bindings.result != 'failure' && needs.publish-bindings.result != 'cancelled'
      && needs.publish.result != 'failure' && needs.publish.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create the tags and GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASES: ${{ needs.validate.outputs.releases }}
        run: python tools/release_tag.py github dist
