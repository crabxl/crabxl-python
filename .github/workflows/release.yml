name: Release Python alpha

on:
  push:
    paths:
      - .github/release-request.json
  workflow_dispatch:
    inputs:
      version:
        description: Committed Git tag version, e.g. 0.1.0-alpha.1
        required: true
        type: string
      feature_notes:
        description: Describe the newly usable functionality and its verified limits
        required: true
        type: string
      usable_feature:
        description: This version adds tested, usable functionality
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: python-alpha-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref_name == github.event.repository.default_branch && (github.event_name == 'push' || inputs.usable_feature)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.request.outputs.version }}
      feature_notes: ${{ steps.request.outputs.feature_notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install 'ruff>=0.16.10,<0.17'
      - run: ruff format --check .
      - run: ruff check .
      - name: Validate explicit release request and committed manual version
        id: request
        env:
          REQUEST_VERSION: ${{ inputs.version }}
          REQUEST_NOTES: ${{ inputs.feature_notes }}
          REQUEST_USABLE: ${{ inputs.usable_feature }}
        run: python tools/release_request.py

  package:
    needs: validate
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-supported-python
        id: pythons
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build portable Linux wheels
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: 'v1.15.0'
          rust-toolchain: 'stable'
          target: ${{ matrix.platform.target }}
          manylinux: '2_28'
          args: >-
            --release --locked --out dist --interpreter
            /opt/python/cp311-cp311/bin/python
            /opt/python/cp312-cp312/bin/python
            /opt/python/cp313-cp313/bin/python
            /opt/python/cp314-cp314/bin/python
            /opt/python/cp315-cp315/bin/python
      - name: Install the native package builder
        if: runner.os != 'Linux'
        run: python -m pip install 'maturin>=1.15,<2'
      - name: Build Windows and macOS wheels
        if: runner.os != 'Linux'
        env:
          PYTHON_PATHS: ${{ toJSON(steps.pythons.outputs) }}
        run: python tools/platform_wheels.py build --target ${{ matrix.platform.target }}
      - name: Test all five installed CPython wheels
        env:
          PYTHON_PATHS: ${{ toJSON(steps.pythons.outputs) }}
        run: python tools/platform_wheels.py test
      - uses: actions/upload-artifact@v7
        with:
          name: release-wheel-${{ matrix.platform.name }}
          path: dist/*.whl
          if-no-files-found: error

  source:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install 'maturin>=1.15,<2'
      - run: maturin sdist --out dist
      - name: Build and test from the source distribution
        run: python tools/test_distribution.py '*.tar.gz'
      - uses: actions/upload-artifact@v7
        with:
          name: release-source
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [validate, package, source]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify artifact identities and safe retries
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: python tools/check_release_files.py "$RELEASE_VERSION"
      - name: Publish to PyPI using OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  release:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Recheck version and create the tag and prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          FEATURE_NOTES: ${{ needs.validate.outputs.feature_notes }}
        run: |
          python tools/release.py check "$RELEASE_VERSION"
          printf '%s\n' "$FEATURE_NOTES" > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$RELEASE_VERSION" > /dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION" dist/* --clobber
          else
            gh release create "$RELEASE_VERSION" dist/* \
              --target "$GITHUB_SHA" --title "$RELEASE_VERSION" --prerelease \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
