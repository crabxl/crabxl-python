name: Difference from openpyxl
description: Code that works with openpyxl 3.1.5 fails or gives a different result with CrabXL.
labels: [compatibility]
body:
  - type: textarea
    id: code
    attributes:
      label: Code
      description: Give the smallest code that shows the difference.
      render: python
    validations:
      required: true
  - type: textarea
    id: openpyxl
    attributes:
      label: openpyxl result
    validations:
      required: true
  - type: textarea
    id: crabxl
    attributes:
      label: CrabXL result
      description: For example, a NotImplementedError or a different value.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CrabXL version
      placeholder: 0.1.0a11
    validations:
      required: true
