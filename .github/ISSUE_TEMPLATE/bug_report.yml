name: Bug report
description: CrabXL gives an incorrect result, an error or a crash.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: CrabXL version
      description: Run `python -c "import crabxl; print(crabxl.__version__)"`.
      placeholder: 0.1.0a11
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and platform
      placeholder: CPython 3.13, Linux x86_64
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What did CrabXL do? Include the full traceback.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What did you expect? If openpyxl gives a different result, tell us.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the smallest code that shows the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Input file
      description: Attach the smallest .xlsx file that shows the problem. Remove confidential data first.
