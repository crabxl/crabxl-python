[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "crabxl"
version = "0.1.0a11"
requires-python = ">=3.11"
description = "Rust spreadsheet processing with an openpyxl-compatible Python surface"
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=9.1.1,<10", "openpyxl==3.1.5", "Pillow>=12.3", "lxml>=6.1.3"]
dev = ["ruff>=0.16.10,<0.17"]

[tool.maturin]
python-source = "python"
module-name = "crabxl._native"

[tool.ruff]
target-version = "py311"
extend-exclude = [
    "tests/test_upstream_worksheet.py",
    "tests/test_upstream_workbook.py",
    "tests/test_upstream_translate.py",
    # Copied from openpyxl; see third_party/README.md.
    "python/crabxl/descriptors",
    "python/crabxl/compat",
    "python/crabxl/xml",
    "python/crabxl/comments",
    "python/crabxl/packaging",
    "python/crabxl/formatting",
    "python/crabxl/styles/_x",
    "python/crabxl/styles/differential.py",
    "python/crabxl/utils/cell.py",
    "python/crabxl/utils/escape.py",
    "python/crabxl/utils/protection.py",
    "python/crabxl/utils/units.py",
    "python/crabxl/utils/datetime.py",
    "python/crabxl/utils/formulas.py",
    "python/crabxl/utils/bound_dictionary.py",
    "python/crabxl/utils/indexed_list.py",
    "python/crabxl/worksheet/table.py",
    "python/crabxl/worksheet/filters.py",
    "python/crabxl/worksheet/datavalidation.py",
    "python/crabxl/worksheet/header_footer.py",
    "python/crabxl/worksheet/protection.py",
    "python/crabxl/worksheet/print_settings.py",
    "python/crabxl/worksheet/related.py",
    "python/crabxl/workbook/defined_name.py",
    "python/crabxl/workbook/protection.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
