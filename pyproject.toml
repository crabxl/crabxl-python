[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "crabxl"
version = "0.1.3"
requires-python = ">=3.11"
description = "Fast, low-memory Python library for reading, writing and editing Excel XLSX files, with the openpyxl API."
readme = "README.md"
license = "MIT"
keywords = ["xlsx", "excel", "spreadsheet", "openpyxl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]

[project.urls]
Homepage = "https://crabxl.com"
Repository = "https://github.com/crabxl/crabxl-python"
Changelog = "https://github.com/crabxl/crabxl-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/crabxl/crabxl-python/issues"

[project.optional-dependencies]
test = ["pytest>=9.1.1,<10", "openpyxl==3.1.5", "Pillow>=12.3", "lxml>=6.1.3"]
dev = ["ruff>=0.16.10,<0.18"]

[tool.maturin]
python-source = "python"
module-name = "crabxl._native"

[tool.ruff]
target-version = "py311"
extend-exclude = [
    "tests/test_upstream_worksheet.py",
    "tests/test_upstream_workbook.py",
    "tests/test_upstream_translate.py",
    # Copied from openpyxl; see third_party/README.md.
    "python/crabxl/descriptors",
    "python/crabxl/compat",
    "python/crabxl/xml",
    "python/crabxl/comments",
    "python/crabxl/chart",
    "python/crabxl/drawing/colors.py",
    "python/crabxl/drawing/effect.py",
    "python/crabxl/drawing/fill.py",
    "python/crabxl/drawing/geometry.py",
    "python/crabxl/drawing/line.py",
    "python/crabxl/drawing/text.py",
    "python/crabxl/packaging",
    "python/crabxl/formatting",
    "python/crabxl/styles/_x",
    "python/crabxl/styles/differential.py",
    "python/crabxl/utils/cell.py",
    "python/crabxl/utils/escape.py",
    "python/crabxl/utils/protection.py",
    "python/crabxl/utils/units.py",
    "python/crabxl/utils/datetime.py",
    "python/crabxl/utils/formulas.py",
    "python/crabxl/utils/bound_dictionary.py",
    "python/crabxl/utils/indexed_list.py",
    "python/crabxl/worksheet/table.py",
    "python/crabxl/worksheet/filters.py",
    "python/crabxl/worksheet/datavalidation.py",
    "python/crabxl/worksheet/header_footer.py",
    "python/crabxl/worksheet/page.py",
    "python/crabxl/worksheet/protection.py",
    "python/crabxl/worksheet/print_settings.py",
    "python/crabxl/worksheet/related.py",
    "python/crabxl/workbook/defined_name.py",
    "python/crabxl/workbook/protection.py",
    "python/crabxl/utils/dataframe.py",
    "python/crabxl/worksheet/cell_watch.py",
    "python/crabxl/worksheet/custom.py",
    "python/crabxl/worksheet/errors.py",
    "python/crabxl/worksheet/picture.py",
    "python/crabxl/worksheet/smart_tag.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
