# The development workspace of the three packages in packages/: crabxl,
# crabxl-openpyxl and crabxl-bindings, the native module they share. Each one
# has its own pyproject.toml, version and changelog.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
crabxl = { workspace = true }
crabxl-openpyxl = { workspace = true }
crabxl-bindings = { workspace = true }

[dependency-groups]
test = [
    "pytest>=9.1.1,<10; python_version >= '3.10'",
    "pytest>=8.4,<9; python_version < '3.10'",
    "openpyxl==3.1.5",
    "Pillow>=12.3; python_version >= '3.10'",
    "Pillow>=11.3,<12; python_version < '3.10'",
    "lxml>=6.1.3",
]
dev = [{ include-group = "test" }, "ruff>=0.16.10,<0.17"]

[tool.ruff]
target-version = "py39"
# The adapter supports Python 3.9; crabxl needs 3.13.
per-file-target-version = { "packages/crabxl/**" = "py313", "tests/api/**" = "py313", "tools/**" = "py314" }
extend-exclude = [
    "tests/adapter/test_upstream_worksheet.py",
    "tests/adapter/test_upstream_workbook.py",
    "tests/adapter/test_upstream_translate.py",
    # Copied from openpyxl; see third_party/README.md.
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/descriptors",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/compat",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/xml",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/comments",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/chart",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/drawing/colors.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/drawing/effect.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/drawing/fill.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/drawing/geometry.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/drawing/line.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/drawing/text.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/packaging",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/formatting",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/styles/_x",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/styles/differential.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/utils/cell.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/utils/escape.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/utils/protection.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/utils/units.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/utils/datetime.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/utils/formulas.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/utils/bound_dictionary.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/utils/indexed_list.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/worksheet/table.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/worksheet/filters.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/worksheet/datavalidation.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/worksheet/header_footer.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/worksheet/page.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/worksheet/protection.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/worksheet/print_settings.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/worksheet/related.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/workbook/defined_name.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/workbook/protection.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/utils/dataframe.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/worksheet/cell_watch.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/worksheet/custom.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/worksheet/errors.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/worksheet/picture.py",
    "packages/crabxl-openpyxl/src/crabxl_openpyxl/worksheet/smart_tag.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "FA102", "I", "UP"]

# crabxl is fully typed. crabxl-openpyxl mirrors openpyxl's own untyped
# modules and is not checked.
[tool.mypy]
strict = true
python_version = "3.13"
warn_unreachable = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]
mypy_path = "packages/crabxl/src,packages/crabxl-bindings/python"
packages = ["crabxl"]

[[tool.mypy.overrides]]
# Untyped, like openpyxl.
module = "crabxl_openpyxl.*"
ignore_missing_imports = true
follow_imports = "skip"

[tool.pyright]
include = ["packages/crabxl/src/crabxl"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
extraPaths = ["packages/crabxl/src", "packages/crabxl-bindings/python"]
# The modules of the package call each other's private members, such as the
# native handle; the public API has no private names.
reportPrivateUsage = false
# A setter may accept more than its getter returns, such as a hex string for
# a Color or a Formula for a value.
reportPropertyTypeMismatch = false
# Rules that strict mode leaves off.
reportCallInDefaultInitializer = "error"
reportImplicitOverride = "error"
reportImplicitStringConcatenation = "error"
reportImportCycles = "error"
reportMissingSuperCall = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedCallResult = "error"

[tool.pyrefly]
project-includes = ["packages/crabxl/src/crabxl"]
search-path = ["packages/crabxl/src", "packages/crabxl-bindings/python"]
python-version = "3.13"

[tool.ty.src]
include = ["packages/crabxl/src/crabxl"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
all = "error"
