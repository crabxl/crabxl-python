[package]
name = "crabxl-bindings"
version = "0.6.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/crabxl/crabxl-python"
description = "Native PyO3 module shared by the crabxl and crabxl-openpyxl Python packages"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
default = ["deflate-zlib-rs"]
deflate-zlib-rs = ["crabxl/deflate-zlib-rs", "crabxl-xlsx/deflate-zlib-rs"]
deflate-zlib = ["crabxl/deflate-zlib", "crabxl-xlsx/deflate-zlib"]

[dependencies]
crabxl = { version = "=0.4.1", default-features = false, features = ["calc"] }
crabxl-core = { version = "=0.4.1" }
crabxl-xlsx = { version = "=0.4.1", default-features = false, features = ["calc"] }
crabxl-calc = { version = "=0.4.1" }
chrono = { version = "0.4", default-features = false }
pyo3 = { version = "0.30.1", features = ["extension-module"] }
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
