[build-system]
requires = ["maturin>=1.16.0,<2"]
build-backend = "maturin"

[project]
name = "crabxl-bindings"
dynamic = ["version"]
requires-python = ">=3.9"
description = "Native Rust module shared by crabxl and crabxl-openpyxl. Install crabxl or crabxl-openpyxl instead."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["crabxl", "excel", "xlsx", "rust", "pyo3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]

[project.urls]
Homepage = "https://crabxl.com"
Repository = "https://github.com/crabxl/crabxl-python"
Changelog = "https://github.com/crabxl/crabxl-python/blob/main/packages/crabxl-bindings/CHANGELOG.md"
Issues = "https://github.com/crabxl/crabxl-python/issues"

[tool.maturin]
python-source = "python"
module-name = "crabxl_bindings._native"
