[package]
name = "crabxl-python"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/crabxl/crabxl-python"
description = "Optional Python compatibility adapter for crabxl"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
crabxl = { git = "https://github.com/crabxl/crabxl.git", rev = "7e9eb8db613d1f9fd921f8698c50f858c76009bb" }
pyo3 = { version = "0.29.3", features = ["extension-module"] }
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
