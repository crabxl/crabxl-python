[package]
name = "crabxl-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/crabxl/crabxl-python"
description = "Optional Python compatibility adapter for crabxl"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
crabxl = { git = "https://github.com/crabxl/crabxl.git", rev = "34e1bd4d0cc1a256cc2f1c3d1e720c89cf7cb026" }
pyo3 = { version = "0.26", features = ["extension-module"] }
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
