[package]
name = "crabxl-python"
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/crabxl/crabxl-python"
description = "Optional Python compatibility adapter for crabxl"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
crabxl = { git = "https://github.com/crabxl/crabxl.git", rev = "9311bb18f5960391e0e2b55e2a50044b6e7bfa47" }
pyo3 = { version = "0.29.3", features = ["extension-module"] }
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
