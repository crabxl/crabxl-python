[package]
name = "crabxl-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/crabxl/crabxl-python"
description = "Optional Python compatibility adapter for crabxl"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
crabxl = { git = "https://github.com/crabxl/crabxl.git", rev = "a3d957f992a90a174b0a81d0a2530203e1370bdd" }
pyo3 = { version = "0.26", features = ["extension-module"] }
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
