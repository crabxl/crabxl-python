[package]
name = "crabxl-python"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/crabxl/crabxl-python"
description = "Optional Python compatibility adapter for crabxl"

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
default = ["deflate-zlib-rs"]
deflate-zlib-rs = ["crabxl/deflate-zlib-rs"]
deflate-zlib = ["crabxl/deflate-zlib"]

[dependencies]
crabxl = { version = "=0.2.0", default-features = false, features = ["calc"] }
chrono = { version = "0.4", default-features = false }
pyo3 = { version = "0.30.1", features = ["extension-module"] }
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
